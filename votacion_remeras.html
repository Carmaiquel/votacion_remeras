<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votacion de Remeras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f4f4f4;padding:1rem}
.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:22px;font-weight:600;margin-bottom:.25rem}
.header p{font-size:14px;color:#666}
.name-section{background:#fff;border:1px solid #ddd;border-radius:12px;padding:1rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px;max-width:600px;margin-left:auto;margin-right:auto}
.name-section label{font-size:14px;color:#555;white-space:nowrap}
.name-section input{flex:1;font-size:15px;border:1px solid #ccc;border-radius:8px;padding:.4rem .6rem;outline:none}
.name-section input:focus{border-color:#f59e0b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;max-width:1000px;margin:0 auto 1.5rem}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card-body{padding:.75rem}
.shirt-label{font-size:13px;font-weight:500;color:#555;margin-bottom:.5rem;text-align:center}
.stars{display:flex;justify-content:center;gap:4px}
.star{font-size:26px;cursor:pointer;color:#ddd;transition:color .1s;user-select:none;line-height:1}
.star.active{color:#f59e0b}
.submit-area{text-align:center;padding-bottom:2rem}
.btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:.6rem 2rem;font-size:15px;cursor:pointer;color:#333}
.btn:hover:not(:disabled){background:#f5f5f5}
.btn:disabled{opacity:.4;cursor:default}
.success{color:#16a34a;font-size:14px;margin-top:.5rem}
.results{display:none;background:#fff;border:1px solid #ddd;border-radius:12px;padding:1.25rem;max-width:600px;margin:1.5rem auto}
.results h2{font-size:16px;font-weight:600;margin-bottom:.75rem}
.total{font-size:13px;color:#666;margin-bottom:.75rem}
.row{display:flex;align-items:center;gap:10px;padding:.4rem 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.rank{font-size:13px;color:#999;width:20px}
.thumb{width:36px;height:48px;object-fit:cover;border-radius:4px}
.rlabel{font-size:13px;color:#555;flex:1}
.bar-wrap{width:100px;background:#f0f0f0;border-radius:4px;height:8px;overflow:hidden}
.bar{height:8px;background:#f59e0b;border-radius:4px}
.rscore{font-size:13px;font-weight:600;color:#333;width:45px;text-align:right}
</style>
</head>
<body>
<div class="header">
  <h1>Votacion de remeras</h1>
  <p>Puntua cada remera del 1 al 5 - cada padre vota una sola vez</p>
</div>
<div class="name-section">
  <label for="voterName">Tu nombre:</label>
  <input type="text" id="voterName" placeholder="Escribi tu nombre...">
</div>
<div class="grid" id="shirtGrid"></div>
<div class="submit-area">
  <button class="btn" id="submitBtn" disabled>Enviar mi votacion</button>
  <div class="success" id="successMsg" style="display:none">Votacion enviada! Gracias.</div>
</div>
<div class="results" id="results">
  <h2>Resultados en tiempo real</h2>
  <div class="total" id="totalVotes"></div>
  <div id="resultList"></div>
</div>

const SHIRT_NAMES = ["Remera 1", "Remera 2", "Remera 3", "Remera 4", "Remera 5", "Remera 6", "Remera 7", "Remera 8", "Remera 9", "Remera 10", "Remera 11", "Remera 12", "Remera 13"];

const STORAGE_KEY = "shirt_votes_v1";
let myRatings = Array(13).fill(0);
let submitted = false;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { votes: Array(13).fill(0), counts: Array(13).fill(0), voters: [] };
  } catch(e) { return { votes: Array(13).fill(0), counts: Array(13).fill(0), voters: [] }; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function renderGrid() {
  const grid = document.getElementById('shirtGrid');
  grid.innerHTML = '';
  SHIRT_NAMES.forEach((name, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<img src="'+IMAGES[i]+'" alt="'+name+'" loading="lazy">' +
      '<div class="card-body"><div class="shirt-label">'+name+'</div>' +
      '<div class="stars" id="stars-'+i+'">' +
      [1,2,3,4,5].map(s => '<span class="star'+(myRatings[i]>=s?' active':'')+'" data-idx="'+i+'" data-val="'+s+'">&#9733;</span>').join('') +
      '</div></div>';
    grid.appendChild(card);
  });
  document.querySelectorAll('.star').forEach(s => {
    s.addEventListener('click', function() {
      if (submitted) return;
      const i = +this.dataset.idx, v = +this.dataset.val;
      myRatings[i] = v;
      document.querySelectorAll('#stars-'+i+' .star').forEach(function(st,si) {
        st.classList.toggle('active', si < v);
      });
      checkReady();
    });
  });
}

function checkReady() {
  const name = document.getElementById('voterName').value.trim();
  document.getElementById('submitBtn').disabled = !(name && myRatings.every(function(r){return r>0;}));
}

document.getElementById('voterName').addEventListener('input', checkReady);

document.getElementById('submitBtn').addEventListener('click', function() {
  const name = document.getElementById('voterName').value.trim();
  if (!name || submitted) return;
  const data = loadData();
  if (data.voters.indexOf(name) >= 0) { alert(name + ' ya voto.'); return; }
  for (var i=0;i<13;i++) {
    data.votes[i] = (data.votes[i]||0) + myRatings[i];
    data.counts[i] = (data.counts[i]||0) + 1;
  }
  data.voters.push(name);
  saveData(data);
  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('successMsg').style.display = 'block';
  showResults(data);
});

function showResults(data) {
  document.getElementById('results').style.display = 'block';
  var avgs = data.votes.map(function(v,i) {
    return { i: i, avg: data.counts[i]>0 ? v/data.counts[i] : 0 };
  });
  avgs.sort(function(a,b){ return b.avg - a.avg; });
  var maxAvg = avgs[0].avg || 1;
  document.getElementById('totalVotes').textContent = data.voters.length + ' padre(s) han votado';
  document.getElementById('resultList').innerHTML = avgs.map(function(item,rank) {
    return '<div class="row"><span class="rank">'+(rank+1)+'</span>' +
      '<img class="thumb" src="'+IMAGES[item.i]+'" alt="'+SHIRT_NAMES[item.i]+'">' +
      '<span class="rlabel">'+SHIRT_NAMES[item.i]+'</span>' +
      '<div class="bar-wrap"><div class="bar" style="width:'+Math.round(item.avg/maxAvg*100)+'%"></div></div>' +
      '<span class="rscore">'+item.avg.toFixed(1)+' &#9733;</span></div>';
  }).join('');
}

renderGrid();
var existing = loadData();
if (existing.voters.length > 0) showResults(existing);
</script>
</body>
</html>
